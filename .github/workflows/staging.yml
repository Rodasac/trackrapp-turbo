name: Staging

on:
  push:
    branches: [staging]

env:
  REGISTRY: ghcr.io
  ACME_EMAIL: ${{ secrets.ACME_EMAIL_STAGING }}

jobs:
  # ─── Build staging images ──────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.image }} [staging]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            image: web
          - app: worker
            dockerfile: apps/worker/Dockerfile
            image: worker
          - app: migrate
            dockerfile: packages/database/Dockerfile.migrate
            image: migrate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        env:
          NODE_ENV: development

      - name: Extract metadata for ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=staging
            type=raw,value=staging-${{ github.sha }}
          labels: |
            environment=staging
            org.opencontainers.image.title=${{ matrix.image }}-staging

      - name: Write env secret to temp file
        if: matrix.app == 'web'
        env:
          STAGING_ENV: ${{ secrets.STAGING_ENV }}
        run: printf '%s' "$STAGING_ENV" > /tmp/staging.env

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            NEXT_PUBLIC_APP_ENV=development
          secret-files: |
            ENV_FILE=/tmp/staging.env

  # ─── Deploy to staging VPS ─────────────────────────────────────────────────
  deploy:
    name: Deploy [staging]
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy Traefik compose to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER_STAGING }}
          key: ${{ secrets.VPS_SSH_KEY_STAGING }}
          source: "deploy/docker-compose.traefik.yml"
          target: /opt/trackrapp/traefik
          strip_components: 1

      - name: Copy compose files to staging VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER_STAGING }}
          key: ${{ secrets.VPS_SSH_KEY_STAGING }}
          source: "deploy/docker-compose.staging.yml,deploy/scripts"
          target: /opt/trackrapp/staging
          strip_components: 1

      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: staging-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER_STAGING }}
          key: ${{ secrets.VPS_SSH_KEY_STAGING }}
          envs: IMAGE_TAG,ACME_EMAIL
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            docker network create traefik-public 2>/dev/null || true
            
            docker compose -f /opt/trackrapp/traefik/docker-compose.traefik.yml down
            ACME_EMAIL="$ACME_EMAIL" docker compose -f /opt/trackrapp/traefik/docker-compose.traefik.yml up -d

            cd /opt/trackrapp/staging
            chmod +x scripts/backup.sh
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.staging.yml down -v
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.staging.yml pull
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.staging.yml up -d
