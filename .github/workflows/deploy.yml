name: CI/CD

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ─── Test (runs on every branch and PR) ────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trackrapp_test
          POSTGRES_USER: trackrapp
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackrapp -d trackrapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trackrapp:testpassword@localhost:5432/trackrapp_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Build vitest config (required before tests)
        run: pnpm build --filter=@repo/vitest-config

      - name: Run tests
        run: pnpm test

  # ─── Build Docker images (main + staging branches only) ────────────────────
  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            image: web
          - app: worker
            dockerfile: apps/worker/Dockerfile
            image: worker
          - app: migrate
            dockerfile: packages/database/Dockerfile.migrate
            image: migrate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ─── Deploy to Staging (staging branch only) ───────────────────────────────
  deploy-staging:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to staging VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER_STAGING }}
          key: ${{ secrets.VPS_SSH_KEY_STAGING }}
          source: "deploy/docker-compose.staging.yml,deploy/scripts"
          target: /opt/trackrapp/staging
          strip_components: 1

      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER_STAGING }}
          key: ${{ secrets.VPS_SSH_KEY_STAGING }}
          envs: IMAGE_TAG
          script: |
            cd /opt/trackrapp/staging
            chmod +x scripts/backup.sh
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.staging.yml pull
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.staging.yml up -d

  # ─── Deploy to Production (main branch only) ───────────────────────────────
  deploy-prod:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to production VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/scripts"
          target: /opt/trackrapp/production
          strip_components: 1

      - name: Pre-deploy backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod +x /opt/trackrapp/production/scripts/backup.sh
            docker compose -f /opt/trackrapp/production/docker-compose.prod.yml exec -T backup /backup.sh || true

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd /opt/trackrapp/production
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d
