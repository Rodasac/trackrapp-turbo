name: Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  ACME_EMAIL: ${{ secrets.ACME_EMAIL_PROD }}

jobs:
  # ─── Build production images ───────────────────────────────────────────────
  build:
    name: Build ${{ matrix.image }} [production]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            image: web
          - app: worker
            dockerfile: apps/worker/Dockerfile
            image: worker
          - app: migrate
            dockerfile: packages/database/Dockerfile.migrate
            image: migrate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=production
            type=raw,value=production-${{ github.sha }}
          labels: |
            environment=production
            org.opencontainers.image.title=${{ matrix.image }}-production

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          secrets: |
            ENVS_FILE=${{ secrets.PROD_ENV }}

  # ─── Deploy to production VPS ──────────────────────────────────────────────
  deploy:
    name: Deploy [production]
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy Traefik compose to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.traefik.yml"
          target: /opt/trackrapp/traefik
          strip_components: 1

      - name: Copy compose files to production VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/scripts"
          target: /opt/trackrapp/production
          strip_components: 1

      - name: Pre-deploy backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod +x /opt/trackrapp/production/scripts/backup.sh
            docker compose -f /opt/trackrapp/production/docker-compose.prod.yml exec -T backup /backup.sh || true

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: production-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            
            docker network create traefik-public 2>/dev/null || true
            docker compose -f /opt/trackrapp/traefik/docker-compose.traefik.yml pull
            docker compose -f /opt/trackrapp/traefik/docker-compose.traefik.yml down
            ACME_EMAIL="$ACME_EMAIL" docker compose -f /opt/trackrapp/traefik/docker-compose.traefik.yml up -d

            cd /opt/trackrapp/production
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d
