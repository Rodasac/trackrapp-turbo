services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: trackrapp
      POSTGRES_USER: trackrapp
      POSTGRES_PASSWORD: trackrapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackrapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
